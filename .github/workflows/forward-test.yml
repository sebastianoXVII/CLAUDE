# Forward test serale del candidato Noise Area su NQ (proxy QQQ), codice congelato di T6.
# Gira nel cloud di GitHub dopo la chiusura USA, aggiunge i nuovi giorni al registro e lo committa.
name: forward-test-noise-area
on:
  schedule:
    - cron: "40 22 * * 1-5"   # 22:40 UTC = dopo la chiusura delle 16:00 ET (anche con l'ora legale)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas==2.2.3 numpy==2.1.3 scipy==1.14.1 statsmodels==0.14.4 exchange_calendars==4.5.6 pyarrow==18.1.0
      - run: python research/forward/noise_area_forward.py
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      - name: Commit del registro
        run: |
          git config user.name "forward-test-bot"
          git config user.email "forward-test-bot@users.noreply.github.com"
          git add research/forward/noise_area_nq_forward.csv
          git diff --cached --quiet || git commit -m "Forward test Noise Area NQ: $(date -u +%F)"
          git push
